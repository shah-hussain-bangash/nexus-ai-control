<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">NEXUS AI Control architecture and verification</title>
<desc id="desc">Scoped identities and reviewed authority constrain durable execution and recorded outcomes. At source 6fd8dcb all four hosted CI jobs succeeded: backend 954 passed and 18 skipped, PostgreSQL 958 passed and 14 skipped, frontend 100 passed, and OPA five of five. These overlapping suites are not additive. The platform remains a development reference with production acceptance open.</desc>
