<text x="56" y="158" fill="#f3f8ff" font-size="56" font-weight="700">NEXUS AI Control</text>
<text x="56" y="206" class="body" font-size="24">Govern authority. Preserve evidence. Resolve uncertainty.</text>
<rect x="56" y="236" width="398" height="32" rx="16" fill="#273e5c"/><text x="75" y="258" fill="#bce8f2" font-size="14" font-weight="600">DEVELOPMENT SYSTEM / SYNTHETIC EVIDENCE</text>
<text x="56" y="318" class="label">CONTROLLED DECISION AND EXECUTION PATH</text>
<rect class="node" x="56" y="344" width="300" height="164" rx="15"/><text x="78" y="378" fill="#78d6e1" font-size="15" font-weight="600">01</text><text x="78" y="416" class="head">Scoped identity</text><text x="78" y="452" class="body">Workspace and environment</text><text x="78" y="480" class="body">Session / workload generation</text>
<path class="line" d="M359 425H384"/>
<rect class="node" x="394" y="344" width="300" height="164" rx="15"/><text x="416" y="378" fill="#78d6e1" font-size="15" font-weight="600">02</text><text x="416" y="416" class="head">Reviewed authority</text><text x="416" y="452" class="body">Grant, policy and exact payload</text><text x="416" y="480" class="body">Independent human decision</text>
