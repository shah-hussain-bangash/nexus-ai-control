<rect class="node" x="732" y="344" width="300" height="164" rx="15"/><text x="754" y="378" fill="#78d6e1" font-size="15" font-weight="600">03</text><text x="754" y="416" class="head">Bounded execution</text><text x="754" y="452" class="body">Durable intent and worker claim</text><text x="754" y="480" class="body">Revalidate before dispatch</text>
<path class="line" d="M1035 425H1060"/>
