name: NEXUS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows-local:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest tests/test_windows_local_shutdown.py tests/test_local_runtime.py --junitxml=windows-local-results.xml
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: windows-local-tests, path: backend/windows-local-results.xml}
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements-dev.txt
      - run: python scripts/export_production_roadmap.py --check
      - run: python -m pytest --junitxml=test-results.xml
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backend-tests, path: backend/test-results.xml}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm test && npm run build
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python -m pip install -r backend/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest browser_tests --junitxml=browser-results.xml
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-tests, path: backend/browser-results.xml}
  pilot-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate pilot Compose configuration and service boundaries
        env:
          NEXUS_IMAGE: registry.example.invalid/nexus:ci-fixture
          NEXUS_EDGE_IMAGE: registry.example.invalid/caddy:ci-fixture
          NEXUS_OPA_IMAGE: registry.example.invalid/opa:ci-fixture
          NEXUS_HOSTNAME: nexus-ci.example.invalid
        run: |
          set -euo pipefail
          export NEXUS_RUNTIME_ENV="$RUNNER_TEMP/nexus-pilot-ci.env"
          cp infra/pilot/runtime.env.example "$NEXUS_RUNTIME_ENV"
          docker compose -f infra/pilot/compose.yaml config -q
          rendered="$RUNNER_TEMP/nexus-pilot-compose.json"
          docker compose -f infra/pilot/compose.yaml --profile '*' config --format json > "$rendered"
          python - "$rendered" <<'PY'
          import json
          import sys
          from pathlib import Path

          config = json.loads(Path(sys.argv[1]).read_text())
          services = config["services"]
          assert set(services) == {"edge", "opa", "migrate", "api", "synthetic-worker"}
          assert config["networks"]["control"]["internal"] is True
          assert set(services["opa"]["networks"]) == {"control"}
          published_ports = {
              name: {str(port["published"]) for port in service["ports"]}
              for name, service in services.items() if service.get("ports")
          }
          assert published_ports == {"edge": {"80", "443"}}, published_ports
          assert services["migrate"]["profiles"] == ["maintenance"]
          assert services["synthetic-worker"]["profiles"] == ["synthetic-demo-only"]
          print("Pilot Compose configuration and service boundaries verified.")
          PY
  opa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD/policies:/policies:ro" openpolicyagent/opa:1.0.1-static test /policies
  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        # Disposable CI-only credentials; never use these values in a deployment.
        env:
          POSTGRES_DB: nexus_ci
          POSTGRES_USER: nexus_ci
          POSTGRES_PASSWORD: ci_disposable_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U nexus_ci -d nexus_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NEXUS_TEST_DATABASE_URL: postgresql+psycopg://nexus_ci:ci_disposable_only@127.0.0.1:5432/nexus_ci
      NEXUS_TEST_ALLOW_SCHEMA_CREATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest tests/test_ci_postgresql_recovery.py --junitxml=../docs/postgresql-recovery-ci-results.xml
        working-directory: backend
      - run: python -m pytest --ignore=tests/test_ci_postgresql_recovery.py --junitxml=../docs/postgresql-ci-results.xml
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgresql-tests
          path: |
            docs/postgresql-ci-results.xml
            docs/postgresql-recovery-ci-results.xml
