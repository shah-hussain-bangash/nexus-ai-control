name: Disposable Docker recovery
on:
  pull_request:
    paths:
      - 'scripts/run_docker_recovery_drill.py'
      - 'scripts/docker_recovery/**'
      - 'backend/tests/test_docker_recovery_tooling.py'
      - '.github/workflows/docker-recovery.yml'
permissions:
  contents: read
jobs:
  docker-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements-dev.txt
      - name: Rehearse only disposable Docker recovery
        run: python scripts/run_docker_recovery_drill.py --run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disposable-docker-recovery
          path: backend/data/drills/synthetic-docker-recovery-*.json
